version: 2

registries:
  nav-maven:
    type: maven-repository
    url: "https://github-package-registry-mirror.gc.nav.no/cached/maven-release"

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github:
        patterns:
          - "*"
    cooldown:
      default-days: 3
  - package-ecosystem: gradle
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
    groups:
      central-admin:
        patterns:
          - "no.nav.tms:*"
      internal:
        patterns:
          - "com.github.f4b6a3:*"
        update-types:
          - "minor"
          - "patch"
      gradle-major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: npm
    directory: "/web-app"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"